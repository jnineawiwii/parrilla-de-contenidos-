{% extends "layout.html" %}

{% block title %}Nuevo Mensaje - RTP CMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2><i class="bi bi-envelope-plus text-success"></i> Nuevo Mensaje</h2>
        
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Para <span class="text-danger">*</span></label>
                        <select class="form-select" name="receiver_id" required>
                            <option value="">Seleccionar usuario...</option>
                            {% for user in users %}
                            <option value="{{ user.user_id }}" {% if request.args.get('receiver_id')|int == user.user_id %}selected{% endif %}>
                                {{ user.full_name }} ({{ user.role }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Asunto</label>
                        <input type="text" class="form-control" name="subject" 
                               value="{{ request.args.get('subject', '') }}" placeholder="Asunto del mensaje">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mensaje <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="content" rows="6" required placeholder="Escribe tu mensaje aquí..."></textarea>
                        <div class="mt-1 text-end">
                            <small class="text-muted" id="charCount">0 caracteres</small>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-send"></i> Enviar Mensaje
                        </button>
                        <a href="{{ url_for('messages') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelector('textarea[name="content"]').addEventListener('input', function() {
    document.getElementById('charCount').textContent = this.value.length + ' caracteres';
});
</script>
{% endblock %}
